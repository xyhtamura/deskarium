<!doctype html>
<!-- The page the Pi boots.

     It sits in rpi/ with the kiosk script and the systemd unit rather
     than beside the other variants, because it is a deployment target
     and not a fifth variant: `data-variant` below says what it behaves
     like, and this file says which machine loads it. That separation is
     the point of the folder — when the panel wants something the web
     pages should not have, it changes here and nothing else moves.

     Builds to dist/rpi/index.html. See rpi/README.md for the install. -->
<html lang="en" data-variant="upside-down-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#b3e2fd" />
    <title>Deskarium — Panel</title>
    <script type="module" crossorigin src="../assets/main-F53Q9DtX.js"></script>
    <link rel="stylesheet" crossorigin href="../assets/main-B8e06eQ2.css">
  <link rel="manifest" href="../manifest.webmanifest"><script id="vite-plugin-pwa:register-sw">if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('../sw.js',{scope:'../'})})}</script></head>
  <body>
    <div id="root"></div>
  </body>
</html>
